<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Nieuws</title>
  <meta name="theme-color" content="#1f5fbf">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="head-row">
      <h1>Mijn Nieuws</h1>
      <button id="refresh" class="refresh" aria-label="Nieuws vernieuwen">↻</button>
    </div>
    <p id="updated" class="muted"></p>
  </header>

  <main>
    <div class="controls">
      <input id="search" type="search" placeholder="Zoek in koppen…" aria-label="Zoek in koppen">
      <div id="topics" class="topics" role="group" aria-label="Onderwerp"></div>
    </div>

    <p id="status" class="muted"></p>
    <ul id="list" class="list"></ul>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
